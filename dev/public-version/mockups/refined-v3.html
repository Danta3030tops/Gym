<!doctype html>
<meta charset="utf-8">
<title>Spott mockups v3: Apple font, hamburger menu, less crowded (static, not wired to the app)</title>
<style>
:root{--bg:linear-gradient(180deg,#5b4628 0%,#33261a 30%,#17120d 62%,#0d0b09 100%);--line:rgba(255,255,255,.10);--tx:#f7f5f1;--mu:#c2bdb3;--dim:#9a958b;--acc:#ffa31a;--ok:#4cc38a;
  --g:rgba(255,255,255,.075);--g2:rgba(255,255,255,.12);--gb:rgba(255,255,255,.14);--bar:rgba(52,44,34,.55);--well:rgba(0,0,0,.26);--pop:rgba(58,50,40,.62);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;display:flex;gap:32px;padding:32px;font-family:var(--font);font-size:16px;line-height:1.3;-webkit-font-smoothing:antialiased}
.phone{color:var(--tx);width:390px;height:844px;background:var(--bg);position:relative;overflow:hidden;flex:none;padding:60px 16px 0}
.phone.light{--bg:linear-gradient(180deg,#f6dcb6 0%,#f5e9d6 30%,#f3f0ea 62%);--line:rgba(0,0,0,.09);--tx:#161512;--mu:#57534b;--dim:#7a766d;--acc:#b86a00;--ok:#1f8a5b;
  --g:rgba(255,255,255,.58);--g2:rgba(255,255,255,.8);--gb:rgba(255,255,255,.85);--bar:rgba(255,255,255,.6);--well:rgba(0,0,0,.05);--pop:rgba(255,255,255,.72)}
.glass{background:var(--g);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);border:1px solid var(--gb);border-radius:28px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 24px rgba(0,0,0,.16)}
.phone.light .glass{box-shadow:0 6px 20px rgba(60,40,10,.08)}
h1{font-weight:700;font-size:34px;line-height:1.1;letter-spacing:-.02em}
.sub{font-size:15px;color:var(--mu)}
.cap{font-size:13px;color:var(--mu)}
.num{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.mu{color:var(--mu)}.acc{color:var(--acc)}
.row{display:flex;align-items:center}.sp{justify-content:space-between}
.pad{padding:0 8px}
.rb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.rb svg,.mi svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rb.sm{width:36px;height:36px}
.pill{height:36px;padding:0 16px;border-radius:18px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.link{color:var(--acc);font-weight:600;font-size:15px}

/* floating frosted tab bar: three tabs, everything else lives in the menu */
.tabs{position:absolute;left:44px;right:44px;bottom:24px;height:66px;padding:6px;border-radius:33px;background:var(--bar);-webkit-backdrop-filter:blur(34px) saturate(180%);backdrop-filter:blur(34px) saturate(180%);border:1px solid var(--gb);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 12px 32px rgba(0,0,0,.32);display:flex}
.phone.light .tabs{box-shadow:0 10px 28px rgba(60,40,10,.14)}
.tabs div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--tx);border-radius:27px}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs .on{color:var(--acc);background:var(--well)}

/* workout */
.seg{display:flex;padding:4px;border-radius:20px}
.seg div{flex:1;text-align:center;padding:8px 0;font-weight:600;font-size:15px;color:var(--mu);border-radius:16px}.seg .on{color:var(--tx);background:var(--g2)}
.seg .tick{color:var(--ok);margin-left:4px}
.bar{height:4px;border-radius:2px;background:var(--g2)}.bar i{display:block;height:4px;border-radius:2px;background:var(--acc)}
.set{display:grid;grid-template-columns:24px 1fr 1fr 44px;gap:10px;align-items:center;height:56px}
.set .n{color:var(--mu);font-weight:600}
.set .in{height:44px;border-radius:14px;background:var(--well);border:1px solid var(--line);display:flex;align-items:baseline;justify-content:center;gap:5px;font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;padding-top:10px}
.set .in small{font-size:13px;color:var(--dim);font-weight:500}
.set.todo .in{color:var(--dim);font-weight:400}.set.cur .in{border-color:var(--acc)}
.set .ck{width:40px;height:40px;border-radius:50%;border:1px solid var(--gb);background:var(--g2);display:grid;place-items:center;justify-self:end}
.set .ck svg{width:18px;height:18px;stroke:var(--dim);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.set.done .ck{background:var(--ok);border-color:transparent}.set.done .ck svg{stroke:#08130d}

/* menu popover */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.28)}
.menu{position:absolute;right:16px;top:112px;width:262px;border-radius:26px;background:var(--pop);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--gb);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 24px 60px rgba(0,0,0,.45);overflow:hidden}
.mi{height:50px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;font-size:17px;border-top:1px solid var(--line)}
.mi:first-child{border:0}.mi.gap{border-top:8px solid rgba(0,0,0,.18)}
.mi span{color:var(--mu);font-size:15px;margin-left:auto;margin-right:12px}

/* friends */
.lb{padding:0 18px}.lb .r{display:flex;align-items:center;height:68px;border-bottom:1px solid var(--line)}
.lb .rk{font-weight:700;font-size:17px;width:26px;color:var(--dim);font-variant-numeric:tabular-nums}
.lb .av{width:40px;height:40px;border-radius:50%;background:var(--g2);display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--mu);margin-right:12px}
.lb .me{background:var(--g2);margin:0 -18px;padding:0 18px}.lb .me .rk{color:var(--acc)}
.lb .v{margin-left:auto;text-align:right}.lb .v b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.lb small{display:block;font-size:13px;color:var(--mu)}

/* history */
.stats{display:grid;grid-template-columns:1fr 1fr}
.stats div{padding:16px 18px}.stats div:nth-child(odd){border-right:1px solid var(--line)}
.stats b{font-size:26px;font-weight:700;letter-spacing:-.02em;display:block;margin-top:2px;font-variant-numeric:tabular-nums}
.pr{display:flex;align-items:center;height:50px;border-top:1px solid var(--line)}
.pr span{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}.pr em{font-style:normal;color:var(--mu);font-size:13px;width:58px}
</style>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-w" viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></symbol>
<symbol id="i-h" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l3.500-4 3 2.500L19 8"/></symbol>
<symbol id="i-p" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M2.500 20c.6-3.600 3.200-5.500 6.500-5.500s5.900 1.900 6.500 5.500M16 5.200a3 3 0 0 1 0 5.700M18 14.800c2 .7 3.200 2.400 3.600 5.200"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M5 8h14M5 12h14M5 16h14"/></symbol>
<symbol id="i-dots" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="18" cy="12" r="1.3" fill="currentColor"/></symbol>
<symbol id="i-ck" viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7.500"/></symbol>
<symbol id="i-b" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.500"/><path d="M12 8v7M7 10l5 1 5-1M9 22l3-7 3 7"/></symbol>
<symbol id="i-f" viewBox="0 0 24 24"><path d="M12 2s6 6.500 6 11a6 6 0 0 1-12 0c0-4.500 6-11 6-11z"/></symbol>
<symbol id="i-t" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.500 2M9 2h6"/></symbol>
<symbol id="i-l" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
<symbol id="i-c" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6"/></symbol>
<symbol id="i-s" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
<symbol id="i-pl" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</defs></svg>

<template id="tabs"><div class="tabs"><div data-t="w"><svg><use href="#i-w"/></svg>Workout</div><div data-t="h"><svg><use href="#i-h"/></svg>History</div><div data-t="p"><svg><use href="#i-p"/></svg>Friends</div></div></template>

<!-- WORKOUT (used twice: plain, and with the menu open) -->
<template id="wk">
  <div class="row sp">
    <div class="pad"><div class="cap">Sunday 15 Nov</div><h1>Full Body C</h1></div>
    <div class="rb glass"><svg><use href="#i-menu"/></svg></div>
  </div>
  <div class="seg glass" style="margin-top:20px"><div>Mon<span class="tick">✓</span></div><div>Fri<span class="tick">✓</span></div><div class="on">Sun</div></div>
  <div class="row sp pad cap" style="margin-top:20px"><span>4 of 17 sets</span><span>2 week streak</span></div>
  <div class="bar" style="margin:8px 8px 0"><i style="width:23.5%"></i></div>

  <div class="glass" style="margin-top:20px;padding:20px 18px 12px">
    <div class="row" style="align-items:flex-start;gap:12px">
      <div style="flex:1"><div class="cap">2 of 6</div><div style="font-size:22px;font-weight:700;letter-spacing:-.01em;margin-top:2px">Single-Leg RDL</div><div class="sub" style="margin-top:2px">3 × 10–12 · last 20 kg × 12</div></div>
      <svg width="64" height="54" viewBox="0 0 60 52" fill="none" stroke="var(--tx)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="17" r="4" fill="var(--tx)" stroke="none"/><path d="M13 19l19 5 22-7M32 24l-1 12 1 13M18 21l1 12"/><path d="M15 35h8" stroke="var(--acc)" stroke-width="4"/></svg>
      <div class="rb sm" style="background:var(--g2);border:1px solid var(--gb)"><svg><use href="#i-dots"/></svg></div>
    </div>
    <div style="margin-top:12px">
      <div class="set done"><span class="n">1</span><div class="in">20<small>kg</small></div><div class="in">12<small>reps</small></div><div class="ck"><svg><use href="#i-ck"/></svg></div></div>
      <div class="set cur"><span class="n">2</span><div class="in">22.5<small>kg</small></div><div class="in">10<small>reps</small></div><div class="ck"><svg><use href="#i-ck"/></svg></div></div>
      <div class="set todo"><span class="n">3</span><div class="in">22.5<small>kg</small></div><div class="in">10<small>reps</small></div><div class="ck"><svg><use href="#i-ck"/></svg></div></div>
    </div>
  </div>

  <div class="glass row" style="margin-top:12px;padding:18px;gap:12px">
    <div style="flex:1"><div class="cap">3 of 6</div><div style="font-size:19px;font-weight:700;margin-top:2px">Goblet Squat</div></div><span class="sub">3 × 8–10</span>
  </div>
  <div class="glass row" style="margin-top:12px;padding:18px;gap:12px">
    <div style="flex:1"><div class="cap">4 of 6</div><div style="font-size:19px;font-weight:700;margin-top:2px">Seated Cable Row</div></div><span class="sub">3 × 10–12</span>
  </div>
</template>
<div class="phone" id="s1"></div>
<div class="phone" id="s2"></div>

<!-- FRIENDS -->
<div class="phone" id="s3">
  <div class="row sp">
    <div class="pad"><div class="cap">Week of 9 Nov</div><h1>Friends</h1></div>
    <div class="row" style="gap:8px"><div class="rb glass"><svg><use href="#i-pl"/></svg></div><div class="rb glass"><svg><use href="#i-menu"/></svg></div></div>
  </div>
  <div class="seg glass" style="margin-top:20px"><div class="on">Leaderboard</div><div>Chats <span class="acc">2</span></div><div>People</div></div>
  <div class="lb glass" style="margin-top:12px;overflow:hidden">
    <div class="row sp" style="height:48px;border-bottom:1px solid var(--line)"><span class="cap">Days trained</span><span class="link">This week ⌄</span></div>
    <div class="r"><span class="rk">1</span><span class="av">DR</span><div><b>Dre Reyes</b><small>Trained today</small></div><div class="v"><b>5</b></div></div>
    <div class="r me"><span class="rk">2</span><span class="av">MO</span><div><b>You</b><small>Trained today</small></div><div class="v"><b>3</b></div></div>
    <div class="r"><span class="rk">3</span><span class="av">KT</span><div><b>Kayla Tran</b><small>Last trained Friday</small></div><div class="v"><b>3</b></div></div>
    <div class="r" style="border:0"><span class="rk">4</span><span class="av">JB</span><div><b>Jordan Bell</b><small>Last trained Tuesday</small></div><div class="v"><span class="pill" style="background:var(--g2);border:1px solid var(--gb)">Nudge</span></div></div>
  </div>
  <div class="glass" style="margin-top:12px;padding:18px">
    <div class="row sp"><b>Weekly challenge</b><span class="cap">2 days left</span></div>
    <div class="row" style="margin-top:12px;gap:12px;align-items:baseline">
      <span class="num" style="font-size:40px">3</span><span class="cap">You</span><span class="num mu" style="font-size:24px;margin:0 4px">:</span><span class="num" style="font-size:40px">5</span><span class="cap">Dre</span>
      <span class="sub" style="margin-left:auto">Most sessions</span>
    </div>
  </div>
</div>

<!-- HISTORY (dark and light) -->
<template id="hist">
  <div class="row sp">
    <div class="pad"><div class="cap">Strength trend · 12 weeks</div><h1>Goblet Squat</h1></div>
    <div class="rb glass"><svg><use href="#i-menu"/></svg></div>
  </div>
  <div class="glass" style="margin-top:20px;padding:20px 18px 12px">
    <div class="row" style="align-items:baseline;gap:8px"><span class="num" style="font-size:52px">41.5</span><span class="sub">kg est. 1-rep max</span></div>
    <div style="font-size:14px;color:var(--ok);font-weight:600;margin-top:6px">Up 6.5 kg since 24 Aug</div>
    <svg viewBox="0 0 320 160" style="width:320px;height:160px;margin-top:14px;display:block" fill="none">
      <g stroke="var(--line)" stroke-width="1"><path d="M0 16h292M0 62h292M0 108h292M0 140h292"/></g>
      <g style="font-family:var(--font)" font-size="11" fill="var(--dim)"><text x="300" y="20">42</text><text x="300" y="66">38</text><text x="300" y="112">34</text><text x="0" y="156">Aug</text><text x="94" y="156">Sep</text><text x="188" y="156">Oct</text><text x="268" y="156">Nov</text></g>
      <path d="M4 110L30 104 56 106 82 94 108 88 134 90 160 76 186 70 212 72 238 54 264 40 288 22" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="288" cy="22" r="4.500" fill="var(--acc)"/>
    </svg>
  </div>
  <div class="glass stats" style="margin-top:12px"><div><span class="cap">Sessions</span><b>31</b></div><div><span class="cap">Best set</span><b>32 kg × 9</b></div></div>
  <div class="glass" style="margin-top:12px;padding:16px 18px 4px">
    <div class="row sp" style="padding-bottom:12px"><b>Recent records</b><span class="link">See all</span></div>
    <div class="pr"><em>15 Nov</em><b>Goblet Squat</b><span>32 kg × 9</span></div>
    <div class="pr"><em>13 Nov</em><b>Seated Cable Row</b><span>45 kg × 11</span></div>
    <div class="pr"><em>9 Nov</em><b>Single-Leg RDL</b><span>20 kg × 12</span></div>
  </div>
</template>
<div class="phone" id="s4"></div>
<div class="phone light" id="s5"></div>

<script>
const $=id=>document.getElementById(id), put=(id,t)=>$(id).append($(t).content.cloneNode(true));
put('s1','wk');put('s2','wk');put('s4','hist');put('s5','hist');
for(const [id,t] of [['s1','w'],['s2','w'],['s3','p'],['s4','h'],['s5','h']]){put(id,'tabs');$(id).querySelector(`[data-t="${t}"]`).className='on'}
$('s2').insertAdjacentHTML('beforeend',`<div class="dim"></div>
<div class="rb glass" style="position:absolute;right:16px;top:60px;background:var(--tx);color:#111;border-color:transparent"><svg><use href="#i-menu"/></svg></div>
<div class="menu">
  <div class="mi">Body<svg><use href="#i-b"/></svg></div>
  <div class="mi">Fuel<svg><use href="#i-f"/></svg></div>
  <div class="mi gap">Warm-up<span>5 min</span><svg><use href="#i-t"/></svg></div>
  <div class="mi">Exercises today<span>6</span><svg><use href="#i-l"/></svg></div>
  <div class="mi">Week<span>Nov 9–15</span><svg><use href="#i-h"/></svg></div>
  <div class="mi gap">My coach<svg><use href="#i-c"/></svg></div>
  <div class="mi">Settings<svg><use href="#i-s"/></svg></div>
</div>`);
</script>
